name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Test, lint and build
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: brisa-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
