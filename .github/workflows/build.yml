name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Test, lint and build
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon
      - name: Check permissions
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump permissions "$APK" | tee permissions.txt
          if grep -Eq "CAMERA|RECORD_AUDIO|LOCATION|CONTACTS|SMS|PHONE_STATE|CALL_|EXTERNAL_STORAGE|READ_MEDIA|CALENDAR|BLUETOOTH|BODY_SENSORS" permissions.txt; then
            echo "A sensitive permission appeared. Update PRIVACY.md and the README before allowing it."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: brisa-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            permissions.txt
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
